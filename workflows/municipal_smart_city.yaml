workflow: municipal_smart_city_intelligence

steps:
  - name: analyze
    agent: MunicipalOpsAgent
    task: "Analyze municipal signals (electricity, water, roads, waste, weather, institutions) with South African context"

  - name: reasoning
    agent: ReasoningAgent
    task: "Correlate outages, detect root causes, assess impact on communities, and prioritize by risk"

  - name: recommend
    agent: MunicipalRecommendationAgent
    task: "Generate actionable municipal interventions with timelines and community impact focus"

  - name: respond
    agent: ResponseAgent
    task: "Generate structured municipal intelligence report for operations and leadership"

  - name: monitor
    agent: MonitoringAgent
    task: "Capture run metrics and audit trail"
